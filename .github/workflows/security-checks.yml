name: UniConnect security checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [security/uniconnect-safe-rendering]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/security.test.cjs
